# Builds the Hugo site in site/ and deploys it to GitHub Pages.
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/hugo.yml"
  workflow_dispatch:  # lets you re-run it from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already running
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0  # same version as the local install
    steps:
      - name: Install Hugo (extended)
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Checkout (with the theme submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        working-directory: site
        env:
          HUGO_ENVIRONMENT: production
        # base_url is the live Pages address, so a custom domain just works
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
