<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canadian Voting and Policy Attitudes Project</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css">
<link rel="stylesheet" href="style.css">
<!-- GoatCounter (shared jacklucas site; host-prefixed paths). Not rendered by
     Hugo, so this mirrors layouts/partials/goatcounter.html; app.js adds a
     per-question event. -->
<script>window.goatcounter = {path: function(p) { return location.host + p }};</script>
<script data-goatcounter="https://jacklucas.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<button id="sidebar-toggle" class="sidebar-toggle" aria-label="Open filters" aria-expanded="false" aria-controls="sidebar">
  <span class="sidebar-toggle-icon" aria-hidden="true">&#9776;</span> Filters
</button>
<div id="sidebar-backdrop" class="sidebar-backdrop"></div>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <button id="sidebar-close" class="sidebar-close" aria-label="Close filters">&#10005;</button>
    <h1>Policy Issues</h1>
    <p class="sub">Canadian Voting and Policy Attitudes Project</p>

    <div class="field">
      <label for="domain-select">Policy Domain</label>
      <select id="domain-select"></select>
    </div>

    <div class="field">
      <label for="question-select">Select Policy Issue</label>
      <select id="question-select"></select>
    </div>

    <div class="field">
      <label for="group-select">Select Grouping Variable</label>
      <select id="group-select"></select>
    </div>

    <div class="field">
      <label>Year Range: <span id="year-range-label"></span></label>
      <div class="year-slider">
        <div class="year-slider-track"></div>
        <div class="year-slider-range" id="year-slider-range"></div>
        <input type="range" id="year-min">
        <input type="range" id="year-max">
      </div>
    </div>

    <div class="field" id="party-field" hidden>
      <label>Parties to show <span id="party-count"></span></label>
      <div id="party-checks"></div>
    </div>

    <div id="status">Loading database…</div>
  </div>

  <div class="main">
    <div class="card" id="card">
      <h2 id="title"></h2>
      <p class="wording" id="wording"></p>
      <div class="flag" id="flag" hidden></div>
      <div id="chart"></div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
