# Hugo config for the CVPA project site (theme: ojroques/hugo-researcher).
#
# Served by GitHub Pages at the custom domain policyattitudes.ca (set in the
# repo's Settings -> Pages, DNS at Hover). All internal links are built from
# baseURL; the deploy workflow passes the live Pages URL in with --baseURL
# anyway, so this line mainly keeps local builds matching the live site.
baseURL = "https://policyattitudes.ca/"
title = "Canadian Voting and Policy Attitudes Project"
theme = "researcher"
locale = "en-ca"
disableKinds = ["taxonomy", "term"]

[params]
  lang = "en"
  author = "Jack Lucas"
  description = "Canadian Voting and Policy Attitudes Project"
  # GoatCounter code (the jacklucas.goatcounter.com site, shared with the
  # personal site); see layouts/partials/goatcounter.html. Remove to disable.
  goatcounter = "jacklucas"
  # Sized to match lucasjacklucas.github.io. Link colour and the remaining
  # personal-site tweaks live in assets/css/custom.css.
  [params.style]
    fontFamily = "Inconsolata"
    fontSize = "12pt"      # 16px body text
    pageWidth = "730px"    # 700px text column + Bootstrap's 15px side padding
    colorBlack = "#000000"

# pageRef (not url) so each link resolves to the page's path under baseURL
[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menu.main]]
    name = "Data"
    pageRef = "/data"
    weight = 2
  [[menu.main]]
    name = "Team"
    pageRef = "/team"
    weight = 3
  [[menu.main]]
    name = "Research"
    pageRef = "/research"
    weight = 4
  [[menu.main]]
    name = "Resources"
    pageRef = "/resources"
    weight = 5

[markup.goldmark.renderer]
  unsafe = true  # allow raw HTML in markdown files, as on the personal site

# Light code highlighting (Hugo's default, monokai, is a dark theme)
[markup.highlight]
  style = "github"
